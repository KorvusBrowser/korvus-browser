[workspace.package]
version = "152.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/korvus-browser/korvus-browser"

# DEBUG INFO IS THE OTHER HALF OF THE TEST-BINARY WRITE VOLUME.
#
# WHY. `tests/all.rs` cut the NUMBER of test binaries (144 files to 7 binaries); this cuts what each
# one WEIGHS. Measured 2026-09-11 on this box: with the dev default `debuginfo=2` applied to the whole
# graph a test binary was 443 MB, and the autonomous loop relinking them wrote 3.6 TB/day to the root
# NVMe -- a DRAM-less Samsung 980, whose sustained write collapses to ~80-110 MB/s once its SLC cache
# is exhausted and never recovers because the loop never leaves it idle. Demand exceeded the device,
# the queue grew without bound, and the whole system sat in PSI io FULL stall 72 % of the time: load
# 82.9 with 124 tasks in D state while the CPU was 97 % idle. Dropping debug info for dependencies
# halves the binaries (443 MB -> 218 MB); with the binary count that is 55.6 GB -> 1.65 GB per build.
#
# WHAT IS DELIBERATELY KEPT. Workspace crates stay at `debug = 2`, so gdb/lldb still inspect variables
# in OUR code -- the thing worth debugging. Only third-party crates (deno_core, V8 and the rest of the
# 396-crate graph) lose debug info, and nobody steps through those. `split-debuginfo = "unpacked"`
# leaves DWARF in the .o/.dwo files instead of copying it into every linked binary.
#
# DO NOT "simplify" this to a single `debug = 0`: that would take the workspace's own debug info with
# it. And do not drop the file -- a `git checkout Cargo.toml` silently doubles the write volume again.
[profile.dev]
debug = 2
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 2
split-debuginfo = "unpacked"

[profile.test.package."*"]
debug = 0

# Skia is built from source now (scripts/skia-source.sh), and a dependency's build script is handed its OWN
# opt-level: without this, every dev and test build would rasterize through Skia compiled at -O0.
[profile.dev.package.skia-bindings]
opt-level = 3

[profile.test.package.skia-bindings]
opt-level = 3

# The build korvus SHIPS as -- never the one the gate builds (`cargo build --profile dist`). Link-time
# optimisation across the crates and one codegen unit, for size and speed. The file is left unstripped here
# and stripped by `tools/lean/dist.sh`, which first splits the debug symbols into `korvus.debug` (with a
# gnu-debuglink), so a crash report still symbolises. NOT `panic = "abort"`: `webapi::behavior_rt::__dispatch`
# turns an op's panic into the page's JavaScript error through `catch_unwind`; abort would end the process.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
