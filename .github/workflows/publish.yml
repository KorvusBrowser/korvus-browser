# korvus-browser PyPI publish — Trusted Publishing (OIDC, no tokens).
#
# Publishes the Python launcher (python/, package `korvus-browser`) on a release. DISPATCH-ONLY until:
#   1. a PyPI pending publisher is created — Owner=KorvusBrowser, Repository=korvus-browser,
#      Workflow=publish.yml, Environment=pypi (https://pypi.org/manage/account/publishing/); and
#   2. the `pypi` environment exists on the repo
#      (`gh api -X PUT repos/KorvusBrowser/korvus-browser/environments/pypi`).
# Then pin pypa/gh-action-pypi-publish to a commit sha and enable the `release` trigger below.
name: publish

on:
  workflow_dispatch:
  # release: { types: [published] }

permissions:
  id-token: write    # OIDC Trusted Publishing
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the launcher (sdist + wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@release/v1   # TODO: pin to a commit sha before enabling
        with:
          packages-dir: python/dist
