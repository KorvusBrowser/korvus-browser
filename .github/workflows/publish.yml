# korvus-browser PyPI publish — Trusted Publishing (OIDC, no tokens).
#
# Publishes the Python launcher (python/, package `korvus-browser`) on a release, via OIDC (no token).
# The `pypi` environment exists, the action is pinned to a commit sha, and the `release` trigger is on.
# The ONE remaining prerequisite is the PyPI **pending publisher** (owner's PyPI account + 2FA):
#   https://pypi.org/manage/account/publishing/ → add a pending publisher —
#   Project `korvus-browser`, Owner `KorvusBrowser`, Repository `korvus-browser`,
#   Workflow `publish.yml`, Environment `pypi`.
# Until that exists, a release's publish job runs but fails at the OIDC exchange (harmless; it succeeds on
# a re-run once the pending publisher is added).
name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write    # OIDC Trusted Publishing
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the launcher (sdist + wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: python/dist
