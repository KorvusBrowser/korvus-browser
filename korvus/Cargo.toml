[package]
name = "korvus"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "korvus"
path = "src/main.rs"

[features]
# korvus-analysis Layer 1 (`plugins/korvus-analysis`): record every page call into native code.
# Build into its own target dir so the release binary is never an analysis one:
#   CARGO_TARGET_DIR=target/analysis cargo build --release -p korvus --features analysis
analysis = ["engine/analysis", "dep:analysis"]
# Builtins and constants, reported by a patched V8 (tools/v8-trace/build-korvus.sh
# builds it, into target/analysis-v8).
analysis-v8 = ["analysis", "engine/analysis-v8"]
# WebRTC send-path media (goal A, Slice 1): pass through to korvus-runtime (`engine`). OFF by default, so
# the release binary links no libvpx unless built with the feature (and scripts/vpx-source.sh provisioned).
webrtc-srtp = ["engine/webrtc-srtp"]
webrtc-media = ["engine/webrtc-media"]

[dependencies]
analysis = { workspace = true, optional = true }
spec = { workspace = true }
engine = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "net"] }
anyhow = "1"
webapi = { workspace = true }
persona = { workspace = true }
render = { workspace = true }
transport = { workspace = true }
# `--plugin` and config.toml's `[[plugin]]`: the run-time plugins this process loads.
plugin_host = { workspace = true }
cdp = { workspace = true }
behavior = { workspace = true }
url = "2"
serde_json = "1"
# The popup lines carry structured-clone bytes as base64 (the workspace's own 0.22).
base64 = "0.22"
# config.toml (`[[plugin]]`, goal 1020 step 2).
toml = "0.8"
# A named persona's profile (`store.bin`, the context store's bincode rows) for `korvus persona export|import`; the
# workspace's one bincode.
bincode = "=1.3.3"
# The license token's Ed25519 signature and its base64url / hex (goal 1020 step 6), as the license readers check them.
ring = "0.17"
data-encoding = "2"
