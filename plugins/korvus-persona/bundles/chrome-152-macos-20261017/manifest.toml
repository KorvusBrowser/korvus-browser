[transport]
emulation = "chrome_149"
headers_priority = { stream = 0, weight = 256, exclusive = true }
# The HTTP/2 PRIORITY a request carries. It is Chrome's NETWORK-STACK behaviour, set by the same
# Chromium code on every OS, so a macOS Chrome 152 ships the identical `{stream 0, weight 256,
# exclusive}` that the Linux and Windows 152 captures measured off their h2/QUIC sinks (FP2). It is
# not derivable from a page capture, and a bundle without it silently ships the emulation preset's
# weight, so it is carried here at the family's measured value rather than left to the preset.
# Like headers_priority, the QUIC/H3 wire is Chrome's NETWORK-STACK behaviour, the same Chromium code
# on every OS, so macOS Chrome 152 ships the identical `chrome_150` wire the Linux and Windows 152
# captures measured off their QUIC recorders; absent, the bundle silently ships the emulation preset's
# (chrome_149's) QUIC. Carried here at the family's measured value.
quic = "chrome_150"
# MEASURED 2026-10-16 off a loopback TLS sink (TCP): Chrome 152 adds the `trust_anchors` extension
# (0xca34, draft-ietf-tls-trust-anchor-ids) to its ClientHello, this body, the same on every connection;
# Chrome 150 sends none. It is a NETWORK-STACK constant (Chrome bundles its own root store), so it is the
# same on every OS -- the Linux and Windows 152 captures recorded this identical body -- and macOS Chrome
# 152 (confirmed sending 0xca34 off a live TLS fingerprint echo) ships it too. Absent, korvus-mac drops the
# extension (16 vs Chrome's/Linux's 17), which OpenStreetMap's Fastly edge 429s. korvus-transport writes it
# through BoringSSL (`SSL_set1_requested_trust_anchors`).
trust_anchors = ""

[[known_incoherence]]
id = "ua-stylesheet-inherited"
layers = "capture <-> ua-stylesheet"
detail = "The `ua-stylesheet` artifact was not re-recorded by this promotion; it is still the one the previous bundle used, from a different session."
why = "Promoting the values is one step. Each remaining artifact needs its own emitter to read this capture instead of the committed file, and those land one at a time."
fix = "No emitter: a UA sheet is mostly conditional (`[type=checkbox i]`, `details[open] > summary`, `dialog:not([open])`) and a computed style records one element in one state, so the conditional rules vanish and host-resolved values like the fontconfig default font take their place. The capture's `uaDefaults` block is a cross-check against the committed sheet, not a replacement for it."

[[known_incoherence]]
id = "tls-version"
layers = "UA <-> ClientHello"
detail = "THE WIRE HALF OF THIS ENTRY IS CLOSED (PARITY FP1, 2026-09-19); WHAT REMAINS IS THE PRESET'S NAME. The capture is Chrome 152 on Chromium 152 and the wire is the `chrome_149` preset -- the newest the pinned wreq-util ships in the `chrome` family at or below 152. MEASURED by reading the ClientHello off a loopback TLS sink, not inferred: `plugins/korvus-transport/tests/clienthello.rs`. This engine on `chrome_149` emits JA4 t13i1515h2_8daaf6152771_806a8c22fdea with signature_algorithms 0904,0905,0906,0403,0804,0401,0503,0805,0501,0806,0601 -- byte-identical, in both hashed components, to what real Brave 203.0.113.1, Google Chrome 150.0.7871.46, Microsoft Edge 151.0.4129.93, Opera 135.0.5973.133 put on that same sink. WHAT THIS ENTRY NOW RECORDS IS NOT A DIFFERENCE IN THE BYTES. `coherence::audit` derives the `UA<->TLS.profile` finding from the preset's trailing integer (149) against the UA's Chrome major (152) -- that is, from the NAME -- and the name cannot be changed: wreq-util 0.2 ships no `chrome` preset above 149, and `transport::emulation_for` refuses a preset the pinned library cannot emit rather than substituting another browser's ClientHello. DELETING THIS ENTRY WAS TRIED AND MEASURED on 2026-09-19 and it does not work: with it gone, `Engine::assemble` refuses to boot the bundle."
why = "The pinned wreq-util 0.2 ships chrome_101..149, edge_101..148 and opera_116..131, and this browser is Chrome 152. The preset is chosen from the browser's OWN family -- Brave maps to chrome because Brave ships Chromium's network stack unmodified -- so what remains is a version gap, not a family one. THE BYTES THAT GAP USED TO COST ARE NO LONGER PAID. `korvus-transport::client_for` prepends the three ML-DSA sigalg NAMES (mldsa44:mldsa65:mldsa87) to the preset's own `sigalgs_list`, keeping the preset's tail in the preset's own order, and sets `alps_use_new_codepoint`; neither reads the bundle, so the engine still never asks which browser it is wearing. That works only against a BoringSSL that registers those algorithms in libssl, which the workspace `[patch.crates-io]` rev pin on btls/btls-sys/tokio-btls provides -- upstream merged the registration on 2026-04-23 (4a3cda40b96), three days after btls-sys 0.5.6 was published. The pin ALONE moves nothing (measured: upstream registers ML-DSA for signing, not in the offer default), and the hunk alone fails at Client::build; they are one change."
fix = "NOTHING IN THE WIRE IS LEFT TO FIX -- re-measure before assuming otherwise: `the_four_presets_emit_the_browser_familys_own_ja4` in clienthello.rs asserts t13i1515h2_8daaf6152771_806a8c22fdea for chrome_149, edge_148 and opera_131 alike, asserts each ML-DSA codepoint is present and asserts the current ALPS codepoint; `the_post_quantum_key_share_is_still_offered` asserts the ML-KEM key share 0x11ec survived the dependency move. WHAT CLOSES THE ENTRY ITSELF is one of two things, neither of them a wire change: (a) a wreq-util release carrying a `chrome` preset at 152 or above, so the preset's NAME agrees with the UA and the audit stops firing; or (b) `coherence::audit` learning to compare the wire it can MEASURE rather than the integer in the preset's name -- the honest fix, and a korvus-kernel change rather than a persona one, because the audit has no socket. A capture at a version the preset reproduces exactly would also close it."

[[known_incoherence]]
id = "webgl-pixels"
layers = "deviceOracle <-> rasteriser"
detail = "WebGL strings and getParameter values are replayed from this capture while the pixels are produced by this engine's own software GLES rasteriser."
why = "There is no GPU path; docs/RENDER-SPINE.md records the same gap and does not claim otherwise."
fix = "device-oracle render (relay to the real device), or a rasteriser bound to the claimed GPU."

[[known_incoherence]]
id = "fonts-host"
layers = "persona <-> host"
detail = "The persona claims macOS while text is rasterised through this host's fontconfig."
why = "Serving the persona's fonts needs a font set the render plugin can be pointed at, which does not exist yet."
fix = "Give the bundle a font set and gate skia's FontMgr on it."

