<!doctype html><meta charset=utf-8><title>nav</title><body><p>Navigation timing and paint entries of a plain document.</p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width=1 height=1><script>
window.__dcl = null; window.__early = performance.getEntriesByType('navigation')[0].loadEventEnd;
addEventListener('DOMContentLoaded', () => { const n = performance.getEntriesByType('navigation')[0]; window.__dcl = {loadEventEnd: n.loadEventEnd, dclStartSet: n.domContentLoadedEventStart > 0}; });
</script>
