<!doctype html><title>t</title><body style="margin:0">
<!-- REALWEB S35/S36: a constructed sheet styles exactly the trees whose adoptedStyleSheets list it. -->
<x-a id=a><span>a1</span></x-a>
<x-b id=b mode=wide><span>b1</span></x-b>
<x-c id=c><span>c1</span></x-c>
<div id=d></div><div id=e style="display:block"></div>
<x-f id=f1></x-f><x-f id=f2></x-f>
<x-g id=g></x-g>
<div id=h></div><div id=i></div><div id=j></div><div id=k></div>
<script>
const shell = '<div id=i style="width:70px;height:56px"></div><div style="width:166px;height:56px"></div>';
const sheet = (text) => { const s = new CSSStyleSheet(); s.replaceSync(text); return s; };
const mk = (tag, make) => customElements.define(tag, class extends HTMLElement { constructor() { super(); make(this.attachShadow({mode: 'open'})); } });
// x-a: a <style> in the shadow root (the control). x-b, x-c: the same rules adopted.
mk('x-a', r => { r.innerHTML = shell + '<style>:host { display: flex; width: 240px; }</style>'; });
mk('x-b', r => { r.innerHTML = shell; r.adoptedStyleSheets = [sheet(':host { display: block; } :host([mode=wide]) { display: flex; width: 300px; }')]; });
mk('x-c', r => { r.innerHTML = shell; r.adoptedStyleSheets = [sheet(':host { display: flex; width: 250px; } #i { width: 20px !important; }')]; });
// One sheet adopted by two shadow roots.
const shared = sheet(':host { display: block; width: 111px; height: 7px; }');
mk('x-f', r => { r.adoptedStyleSheets = [shared]; });
// Adopted, then un-adopted.
mk('x-g', r => { r.innerHTML = shell; r.adoptedStyleSheets = [sheet(':host { display: flex; }')]; r.adoptedStyleSheets = []; });
// The document's own adopted sheet: styles the document, and no shadow tree.
const doc = sheet('#d { height: 12px; } #i { width: 5px !important; }');
document.adoptedStyleSheets = [doc];
// A constructed sheet nobody adopts styles nothing.
sheet('#e { height: 77px; }');
// Editing an adopted sheet restyles.
doc.replaceSync('#d { height: 12px; } #i { width: 5px !important; } #k { height: 13px; }');
// Array order is cascade order, not creation order.
const s1 = sheet('#j { height: 3px; }'), s2 = sheet('#j { height: 4px; }');
document.adoptedStyleSheets = [...document.adoptedStyleSheets, s2, s1];
// The observable array: push() adopts too, and splice() un-adopts.
document.adoptedStyleSheets.push(sheet('#h { height: 9px; }'));
const gone = sheet('#i { height: 8px; }');
document.adoptedStyleSheets.push(gone);
document.adoptedStyleSheets.splice(document.adoptedStyleSheets.indexOf(gone), 1);
// The array itself, on a shadow root of its own: one [SameObject] array refilled by the setter,
// converting what an index write stores, and never holding a hole.
const observable = () => {
  const r = [], root = document.createElement('div').attachShadow({mode: 'open'});
  try { root.adoptedStyleSheets[0] = 1; r.push('stored'); } catch (e) { r.push(e.constructor.name + ': ' + e.message); }
  const a = root.adoptedStyleSheets;
  root.adoptedStyleSheets = [new CSSStyleSheet()];
  r.push(a === root.adoptedStyleSheets, a.length, Array.isArray(a), Object.getPrototypeOf(a) === Array.prototype);
  a[5] = new CSSStyleSheet(); r.push(a.length);
  a.length = 3; r.push(a.length);
  delete a[0]; r.push(a.length);
  a.push(new CSSStyleSheet()); r.push(a.length);
  return r.join('|');
};
setTimeout(() => {
  const host = id => { const e = document.getElementById(id); return e.offsetWidth + 'x' + e.offsetHeight + ':' + getComputedStyle(e).display + ':i' + e.shadowRoot.getElementById('i').offsetWidth; };
  const h = id => document.getElementById(id).offsetHeight;
  document.title = JSON.stringify({
    a: host('a'), b: host('b'), c: host('c'),
    d: h('d'), e: h('e'), f: [1, 2].map(n => document.getElementById('f' + n).offsetWidth + 'x' + h('f' + n)).join(','),
    g: getComputedStyle(document.getElementById('g')).display, h: h('h'), i: h('i'), j: h('j'), k: h('k'),
    n: document.adoptedStyleSheets.length,
    o: observable(),
  });
}, 300);
</script>
