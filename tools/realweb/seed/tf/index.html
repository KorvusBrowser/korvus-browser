<!doctype html>
<meta charset="utf-8">
<title>computed transform</title>
<!-- S27: getComputedStyle(el).transform came back AS WRITTEN; Chrome resolves it to matrix()/matrix3d()
     (jwplayer's Swiper parses it: "`nanpx` is not a supported value"). -->
<body>
<div id="w" style="width:200px;height:100px">
<div id="a" style="transform:translate3d(-120px,0,0)"></div>
<div id="b" style="transform:translate(10px, 20px)"></div>
<div id="c" style="transform:rotate(90deg)"></div>
<div id="d" style="transform:scale(2) translateX(5px)"></div>
<div id="e" style="transform:translateX(50%);width:100px"></div>
<div id="f" style="transform:none"></div>
<div id="g"></div>
<div id="h" style="transform:translateZ(10px)"></div>
<div id="i" style="transform:matrix(1,0,0,1,3,4)"></div>
</div>
<script>
window.R = JSON.stringify(['a','b','c','d','e','f','g','h','i'].map(function (id) { return id + '=' + getComputedStyle(document.getElementById(id)).transform; }));
</script>
