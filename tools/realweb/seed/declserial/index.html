<!doctype html><html><body><div id=d></div><script>
// REALWEB S31: a declared (inline) value reads back in its CANONICAL serialization at the token level: a comma is
// ", ", runs of spaces collapse, numbers are re-serialized (1e1px -> 10px, .5 -> 0.5). anime.js splits style.transform on ") translate(" (animejs.com: `translate(12px,34px)` kept as typed).
var cases = [
 ['transform', 'rotate(10deg) translate(12px,34px)'], ['transform', 'rotate(10deg)   translate( 12px , 34px )'], ['transform', 'translate(1e1px, 2px)'],
 ['transform', 'scale(.5,.5)'], ['transform', 'scale(1)translateZ(2px)translate(952px, 75px)'], ['transform', 'translateX( 5px )'], ['filter', 'blur(2px)   brightness(50%)'],
 ['background-image', 'linear-gradient(to right,red,blue)'], ['background-position', 'left  top'], ['margin', '1e1px .5em'],
 ['font-family', 'Arial,  "Helvetica Neue",sans-serif'], ['transition', 'opacity .3s ease-in-out,transform .5s'], ['grid-template-columns', 'repeat(2,1fr)']];
var out = {};
cases.forEach(function (c) { d.removeAttribute('style'); d.style.setProperty(c[0], c[1]); out[c[0] + ': ' + c[1]] = d.style.getPropertyValue(c[0]); });
document.title = JSON.stringify(out);
</script></body></html>
