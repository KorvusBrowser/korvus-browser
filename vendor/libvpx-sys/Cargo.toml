# A thin raw-FFI crate over the libvpx (VP8) that `scripts/vpx-source.sh` builds at the revision Chrome
# pins. It links a VENDORED static libvpx via VPX_LIB_DIR/VPX_INCLUDE_DIR (set in `.cargo/config.toml`)
# and NOTHING ELSE -- there is no pkg-config / system-libvpx code path, by design (J6/I6): the engine
# never links a library the machine happened to have. Not a workspace member, so it is compiled only when
# korvus-runtime's `webrtc-media` feature pulls it in; the default build never touches it.
[package]
name = "libvpx-sys"
version = "0.1.0"
edition = "2021"
links = "vpx"
build = "build.rs"
publish = false

[build-dependencies]
# Already in the graph (skia-bindings uses bindgen); reused here, no new binding version. libvpx's shipped
# prebuilt bindings stop at 1.13.0, older than Chrome's revision, so we always generate our own.
bindgen = "0.70"
