<!DOCTYPE html>
<script src="testing.js"></script>

<!-- KORVUS (PARITY P5a): THE PAGE NOW HAS ROOM TO SCROLL, and every number below is unchanged.
     the reference suite's `scrollTo`/`scrollBy` are bookkeeping over a document with no extent, so this
     fixture asserted 100/200/150 on a page whose content is a few <script> tags. A browser does not
     scroll a document that fits: Chrome 150.0.7871.46, driven over CDP on this page with the
     scripts stripped (2026-09-13), answers scrollX/scrollY == 0 after EVERY step of the four cases
     below, `scrollBy(100, 200)` included. Given a 4000x5000 box it answers exactly what they assert
     -- [100,200], [150,150], [30,40], [0,0] -- so the box is what changed and not the expectations.
     Leaving the page empty and rewriting the numbers to 0 would have left four cases that pass
     whether or not scrolling works at all. The document-with-no-extent case is asserted on its own
     below, where it can fail for the right reason. -->
<div style="width:4000px;height:5000px"></div>

<script id=scrollBy_exists>
  testing.expectEqual('function', typeof window.scrollBy);
</script>

<script id=scrollBy_xy>
  window.scrollTo(0, 0);
  testing.expectEqual(0, window.scrollX);
  testing.expectEqual(0, window.scrollY);
  window.scrollBy(100, 200);
  testing.expectEqual(100, window.scrollX);
  testing.expectEqual(200, window.scrollY);
</script>

<script id=scrollBy_relative>
  window.scrollTo(100, 100);
  window.scrollBy(50, 50);
  testing.expectEqual(150, window.scrollX);
  testing.expectEqual(150, window.scrollY);
</script>

<script id=scrollBy_opts>
  window.scrollTo(0, 0);
  window.scrollBy({ left: 30, top: 40 });
  testing.expectEqual(30, window.scrollX);
  testing.expectEqual(40, window.scrollY);
</script>

<script id=scrollBy_negative_clamp>
  window.scrollTo(10, 10);
  window.scrollBy(-100, -100);
  testing.expectEqual(0, window.scrollX);
  testing.expectEqual(0, window.scrollY);
</script>

<script id=scrollTo_clamps_at_the_documents_own_extent>
  // KORVUS (PARITY P5a), not the reference suite's: the far end of the clamp. `scrollTo(0, 2e6)` leaves the
  // document at its own `scrollHeight - innerHeight` in every browser; leaving it reading 2000000
  // is an assignment wearing a scroll's name, and it is what this engine did on 797 corpus pages.
  // Stated as a relationship rather than as an integer so it holds whatever viewport the persona
  // reports. Chrome 150, measured: 5000px of content in a 993px viewport lands on 4007.
  //
  // PARITY P11b: the extent is against the CLIENT box, not the window. This page overflows both
  // axes, so under a classic-scrollbar theme both viewport scrollbars show, and Chrome 150 on this
  // exact markup (780x513 window, 2026-09-17) lands on scrollY 4518 = scrollHeight 5016 -
  // clientHeight 498 (innerHeight 513) and scrollX 3243 = scrollWidth 4008 - clientWidth 765
  // (innerWidth 780). The `innerHeight` form was only right while no scrollbar took space.
  window.scrollTo(0, 2000000);
  testing.expectEqual(document.documentElement.scrollHeight - document.documentElement.clientHeight, window.scrollY);
  window.scrollTo(2000000, 0);
  testing.expectEqual(document.documentElement.scrollWidth - document.documentElement.clientWidth, window.scrollX);
  window.scrollTo(0, 0);
  // ...and the near end still holds after it.
  testing.expectEqual(0, window.scrollX);
  testing.expectEqual(0, window.scrollY);
</script>

<script id=element_scroll_events_coalesce_and_preserve_reentrancy type=module>
  // KORVUS: the reference suite fires scroll/scrollend on a DETACHED element (3 scrolls, 2 scrollends).
  // CSSOM View's scrollTop setter stops at "the element does not have any associated box", and
  // Chrome 151 answers scrollTop=0 and zero events for exactly this loop, checked directly. The
  // element is attached with overflow so the coalescing this case is about can actually happen.
  // The counts (3, 2) are the reference suite's own, and they follow HTML's "run the scroll steps": the
  // hundred synchronous sets coalesce into ONE scroll event at the next rendering opportunity; the
  // set from inside that handler makes a second; scrollend fires once scrolling settles, and the
  // set from inside it makes a third scroll and a second scrollend. Not re-measured in a headed
  // Chrome: the only tab available while this was written was hidden, where no frame -- and so
  // no scroll event -- ever fires, which is itself the rule this comment describes.
  const state = await testing.async();
  const element = document.createElement('div');
  element.style.cssText = 'height:50px;overflow:auto';
  element.innerHTML = '<div style="height:500px"></div>';
  document.body.appendChild(element);
  let scrolls = 0;
  let scrollends = 0;

  element.addEventListener('scroll', () => {
    scrolls++;
    if (scrolls === 1) {
      element.scrollTop = 101;
    }
  });
  element.addEventListener('scrollend', () => {
    scrollends++;
    if (scrollends === 1) {
      element.scrollTop = 102;
    }
  });

  for (let i = 1; i <= 100; i++) {
    element.scrollTop = i;
  }
  await new Promise(resolve => setTimeout(resolve, 100));

  state.resolve();
  await state.done(() => {
    testing.expectEqual(3, scrolls);
    testing.expectEqual(2, scrollends);
  });
</script>

<script id=element_scrollBy_noop_does_not_fire_events type=module>
  const state = await testing.async();
  const element = document.createElement('div');
  let scrolls = 0;
  let scrollends = 0;

  element.addEventListener('scroll', () => scrolls++);
  element.addEventListener('scrollend', () => scrollends++);
  element.scrollBy(-1, -1);
  await new Promise(resolve => setTimeout(resolve, 50));

  state.resolve();
  await state.done(() => {
    testing.expectEqual(0, scrolls);
    testing.expectEqual(0, scrollends);
  });
</script>
