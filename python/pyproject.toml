[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korvus-browser"
version = "152.0.1"
description = "Launcher for the korvus browser engine (downloads and runs the matching release binary)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1 — see the project LICENSE" }
authors = [{ name = "Trevor Kang" }]

[project.urls]
Homepage = "https://github.com/KorvusBrowser/korvus-browser"

[project.scripts]
korvus = "korvus_browser.__main__:main"

[tool.setuptools]
packages = ["korvus_browser"]
